spring:
  application:
    name: eth-accumulator

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:h2:mem:ethaccumulator;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}

# Accumulator settings
accumulator:
  wallet-address: ${WALLET_ADDRESS:}
  network: ${NETWORK:sepolia}
  dry-run: ${DRY_RUN:true}
  claim-cron: ${CLAIM_CRON:0 0 8 * * ?}   # 08:00 UTC daily

  faucets:
    # Chainstack — API-key auth, no captcha, no mainnet balance. 0.5 Sepolia ETH / 24h.
    # Get a free key at https://console.chainstack.com (Profile → API keys).
    - name: chainstack-sepolia
      type: api
      url: ${CHAINSTACK_FAUCET_URL:https://api.chainstack.com/v1/faucet/sepolia}
      api-key: ${CHAINSTACK_API_KEY:}
      enabled: ${CHAINSTACK_ENABLED:true}

    # pk910 PoW — DISABLED: requires a Cloudflare/hCaptcha token, can't run unattended.
    - name: sepolia-pow-pk910
      type: pow
      url: ${SEPOLIA_POW_FAUCET_URL:https://sepolia-faucet.pk910.de}
      enabled: ${SEPOLIA_POW_ENABLED:false}

    - name: holesky-pow-pk910
      type: pow
      url: ${HOLESKY_POW_FAUCET_URL:https://holesky-faucet.pk910.de}
      enabled: ${HOLESKY_POW_ENABLED:false}

    - name: quicknode-sepolia
      type: api
      url: ${QUICKNODE_FAUCET_URL:https://faucet.quicknode.com/ethereum/sepolia}
      api-key: ${QUICKNODE_API_KEY:}
      enabled: ${QUICKNODE_ENABLED:false}

# REST API auth
api:
  username: ${API_USERNAME:admin}
  password: ${API_PASSWORD:changeme}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.digital.ethaccumulator: INFO
