version: '3.9'

services:
  app:
    image: eth-accumulator:latest
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: eth-accumulator
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/ethaccumulator
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      WALLET_ADDRESS: ${WALLET_ADDRESS}
      NETWORK: ${NETWORK:-sepolia}
      DRY_RUN: ${DRY_RUN:-false}
      CLAIM_CRON: ${CLAIM_CRON:-0 0 8 * * ?}
      SEPOLIA_POW_ENABLED: ${SEPOLIA_POW_ENABLED:-true}
      HOLESKY_POW_ENABLED: ${HOLESKY_POW_ENABLED:-false}
      QUICKNODE_API_KEY: ${QUICKNODE_API_KEY:-}
      QUICKNODE_ENABLED: ${QUICKNODE_ENABLED:-false}
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}
      ALCHEMY_ENABLED: ${ALCHEMY_ENABLED:-false}
      API_USERNAME: ${API_USERNAME:-admin}
      API_PASSWORD: ${API_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eth-net

  postgres:
    image: postgres:16-alpine
    container_name: eth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ethaccumulator
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ethaccumulator"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eth-net

volumes:
  pgdata:

networks:
  eth-net:
    driver: bridge
