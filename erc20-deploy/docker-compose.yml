services:
  besu:
    image: hyperledger/besu:24.12.0
    container_name: besu-dev
    ports:
      - "8545:8545"
      - "8546:8546"
    command:
      - "--network=dev"
      - "--miner-enabled"
      - "--miner-coinbase=0xfe3b557e8fb62b89f4916b721be55ceb828dbd73"
      - "--rpc-http-enabled"
      - "--rpc-http-host=0.0.0.0"
      - "--rpc-http-port=8545"
      - "--rpc-http-cors-origins=*"
      - "--rpc-http-api=ETH,NET,WEB3,MINER"
      - "--host-allowlist=*"
      - "--min-gas-price=0"
      - "--logging=WARN"
    volumes:
      - besu-data:/opt/besu/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST http://localhost:8545 -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"method\":\"net_version\",\"id\":1}' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  besu-data:
