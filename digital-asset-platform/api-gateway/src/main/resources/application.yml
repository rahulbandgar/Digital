server:
  port: 8080

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/users/**
          filters:
            - StripPrefix=0

        - id: wallet-service
          uri: http://localhost:8082
          predicates:
            - Path=/wallet/**
          filters:
            - StripPrefix=0

        - id: asset-service
          uri: http://localhost:8083
          predicates:
            - Path=/assets/**,/tokens/**
          filters:
            - StripPrefix=0

        - id: blockchain-service
          uri: http://localhost:8084
          predicates:
            - Path=/blockchain/**
          filters:
            - StripPrefix=0

        - id: ledger-service
          uri: http://localhost:8085
          predicates:
            - Path=/ledger/**
          filters:
            - StripPrefix=0

        - id: settlement-service
          uri: http://localhost:8086
          predicates:
            - Path=/settlements/**
          filters:
            - StripPrefix=0

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

jwt:
  secret: ${JWT_SECRET:digitalAssetPlatformSecretKey2024!SuperSecureKey}
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    com.digitalasset.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
