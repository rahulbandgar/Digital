version: "3.9"

# ─── Infrastructure ───────────────────────────────────────────────────────────
services:

  # PostgreSQL — one instance, multiple databases
  postgres:
    image: postgres:16-alpine
    container_name: dap-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper (required by Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: dap-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # Apache Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: dap-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Kafka UI — browser at http://localhost:9000
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: dap-kafka-ui
    depends_on:
      - kafka
    ports:
      - "9000:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # Hyperledger Besu (pinned to 23.10.3 — stable Clique/dev mining support)
  besu:
    image: hyperledger/besu:23.10.3
    container_name: dap-besu
    ports:
      - "8545:8545"
      - "8546:8546"
    volumes:
      - ./docker/besu:/opt/besu/config:ro
    command:
      - "--genesis-file=/opt/besu/config/genesis.json"
      - "--node-private-key-file=/opt/besu/config/key"
      - "--rpc-http-enabled"
      - "--rpc-http-host=0.0.0.0"
      - "--rpc-http-cors-origins=*"
      - "--host-allowlist=*"
      - "--rpc-http-api=ETH,NET,WEB3,CLIQUE,ADMIN"
      - "--min-gas-price=0"
      - "--logging=INFO"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST --data '{\"jsonrpc\":\"2.0\",\"method\":\"net_version\",\"params\":[],\"id\":1}' http://localhost:8545 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

# ─── Microservices ────────────────────────────────────────────────────────────

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: dap-user-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_db
      KAFKA_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-digitalAssetPlatformSecretKey2024!SuperSecureKey}

  wallet-service:
    build:
      context: .
      dockerfile: wallet-service/Dockerfile
    container_name: dap-wallet-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wallet_db
      KAFKA_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-digitalAssetPlatformSecretKey2024!SuperSecureKey}

  asset-service:
    build:
      context: .
      dockerfile: asset-service/Dockerfile
    container_name: dap-asset-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/asset_db
      KAFKA_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-digitalAssetPlatformSecretKey2024!SuperSecureKey}

  blockchain-service:
    build:
      context: .
      dockerfile: blockchain-service/Dockerfile
    container_name: dap-blockchain-service
    depends_on:
      besu:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      BLOCKCHAIN_NODE_URL: http://besu:8545
      BLOCKCHAIN_CHAIN_ID: 1337
      KAFKA_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-digitalAssetPlatformSecretKey2024!SuperSecureKey}

  transaction-ledger-service:
    build:
      context: .
      dockerfile: transaction-ledger-service/Dockerfile
    container_name: dap-ledger-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledger_db
      KAFKA_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-digitalAssetPlatformSecretKey2024!SuperSecureKey}

  settlement-service:
    build:
      context: .
      dockerfile: settlement-service/Dockerfile
    container_name: dap-settlement-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8086:8086"
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/settlement_db
      KAFKA_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-digitalAssetPlatformSecretKey2024!SuperSecureKey}

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: dap-api-gateway
    depends_on:
      - user-service
      - wallet-service
      - asset-service
      - blockchain-service
      - transaction-ledger-service
      - settlement-service
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-digitalAssetPlatformSecretKey2024!SuperSecureKey}
      USER_SERVICE_URL: http://user-service:8081
      WALLET_SERVICE_URL: http://wallet-service:8082
      ASSET_SERVICE_URL: http://asset-service:8083
      BLOCKCHAIN_SERVICE_URL: http://blockchain-service:8084
      LEDGER_SERVICE_URL: http://transaction-ledger-service:8085
      SETTLEMENT_SERVICE_URL: http://settlement-service:8086

volumes:
  postgres-data:
