name: Daily ETH Claim

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC every day
  workflow_dispatch:        # allow manual trigger from GitHub mobile app
  push:
    branches:
      - claude/eth-accumulation-java-zGrMy   # run on each push while iterating
    paths:
      - 'eth-accumulator/**'
      - '.github/workflows/eth-claim.yml'

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: eth-accumulator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn package -DskipTests -q

      - name: Run claim (batch mode)
        env:
          SPRING_PROFILES_ACTIVE: batch
          WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS }}
          NETWORK: ${{ vars.NETWORK || 'sepolia' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          SEPOLIA_POW_ENABLED: 'true'
          HOLESKY_POW_ENABLED: ${{ vars.HOLESKY_POW_ENABLED || 'false' }}
          QUICKNODE_ENABLED: ${{ vars.QUICKNODE_ENABLED || 'false' }}
          QUICKNODE_API_KEY: ${{ secrets.QUICKNODE_API_KEY }}
          ALCHEMY_ENABLED: ${{ vars.ALCHEMY_ENABLED || 'false' }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        run: |
          java -jar target/eth-accumulator-1.0.0.jar

      - name: Summary
        if: always()
        run: echo "Claim run finished — check logs above for results"
