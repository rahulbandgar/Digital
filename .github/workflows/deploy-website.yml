name: Deploy TechPulseSoft Website

# Publishes techpulsesoft-website/ to GitHub Pages (free hosting).
on:
  push:
    branches:
      - claude/professional-website-setup-mabnd3
    paths:
      - "techpulsesoft-website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for new pushes.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: techpulsesoft-website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
