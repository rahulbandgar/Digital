<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ad-hoc</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #fff; --text: #1d2330; --muted: #6b7385;
    --border: #e1e4ea; --accent: #2f6fed; --accent-text: #fff;
    --mine: #2f6fed; --mine-text: #fff; --theirs: #eef0f4; --error: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b1f27; --text: #e7e9ee; --muted: #8b93a5;
      --border: #2a303b; --accent: #5b8cff; --accent-text: #fff;
      --mine: #3b6fe0; --mine-text: #fff; --theirs: #262b35; --error: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .hidden { display: none !important; }

  /* Login */
  #login { min-height: 100%; display: grid; place-items: center; padding: 16px; }
  .card {
    width: 100%; max-width: 360px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px; padding: 28px 24px;
  }
  .card h1 { margin: 0 0 12px; font-size: 22px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  input {
    width: 100%; padding: 10px 12px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    font: inherit; cursor: pointer; border: 0; border-radius: 8px;
    background: var(--accent); color: var(--accent-text); padding: 10px 16px;
  }
  button:disabled { opacity: .6; cursor: default; }
  .card button { width: 100%; margin-top: 20px; }
  .error { color: var(--error); font-size: 13px; min-height: 18px; margin-top: 10px; }

  /* Chat */
  #chat { height: 100%; display: flex; flex-direction: column; max-width: 900px; margin: 0 auto; }
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header .title { font-weight: 600; }
  header .who { color: var(--muted); font-size: 13px; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .status.warn { color: var(--error); }
  header button { padding: 6px 12px; font-size: 13px; background: transparent;
    color: var(--muted); border: 1px solid var(--border); }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .note { text-align: center; color: var(--muted); font-size: 12px; margin: 4px 0; }
  .msg { max-width: 75%; align-self: flex-start; }
  .msg.mine { align-self: flex-end; text-align: right; }
  .msg .meta { font-size: 11px; color: var(--muted); margin: 0 4px 2px; }
  .msg .bubble {
    display: inline-block; text-align: left; padding: 8px 12px; border-radius: 14px;
    background: var(--theirs); white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere;
  }
  .msg.mine .bubble { background: var(--mine); color: var(--mine-text); }
  form#composer {
    display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border);
    background: var(--panel);
  }
  #text { flex: 1; resize: none; min-height: 42px; max-height: 140px;
    padding: 10px 12px; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px; }
  #text:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
</style>
</head>
<body>

<section id="login">
  <form class="card" id="loginForm" autocomplete="off">
    <h1>Ad-hoc</h1>
    <label for="name">Display name</label>
    <input id="name" maxlength="32" required>
    <label for="pwd">Password</label>
    <input id="pwd" type="password" required>
    <button type="submit" id="loginBtn">Join</button>
    <div class="error" id="loginErr"></div>
  </form>
</section>

<section id="chat" class="hidden">
  <header>
    <span class="title">Ad-hoc</span>
    <span class="who" id="who"></span>
    <span class="status" id="status"></span>
    <button id="leave" type="button">Leave</button>
  </header>
  <div id="messages" aria-live="polite"></div>
  <form id="composer">
    <textarea id="text" rows="1" maxlength="2000" placeholder="Type a message…"></textarea>
    <button type="submit">Send</button>
  </form>
</section>

<script>
(() => {
  // Chat messages live only in this page. The session token is kept in
  // sessionStorage (this tab only) so a phone that reloads the tab after
  // switching apps can resume without re-entering the password.
  let token = null, me = null, expiresAt = 0, es = null;
  let lastSeq = 0, ackedSeq = 0, lastSeen = 0; // delivery tracking
  let retryTimer = null, retryDelay = 1000, expiryTimer = null;
  const $ = (id) => document.getElementById(id);
  const store = {
    get() { try { return JSON.parse(sessionStorage.getItem('adhocda') || 'null'); } catch { return null; } },
    set(v) { try { sessionStorage.setItem('adhocda', JSON.stringify(v)); } catch {} },
    clear() { try { sessionStorage.removeItem('adhocda'); } catch {} },
  };

  async function post(url, body) {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(data.error || 'Request failed'); e.status = r.status; throw e; }
    return data;
  }

  function time(ts) { return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

  function setStatus(text, warn) {
    $('status').textContent = text;
    $('status').classList.toggle('warn', !!warn);
  }
  function sessionStatus() { setStatus(''); }

  function addNote(text) {
    const d = document.createElement('div');
    d.className = 'note'; d.textContent = text;
    append(d);
  }

  function addMsg(m) {
    const d = document.createElement('div');
    d.className = 'msg' + (m.from === me ? ' mine' : '');
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = (m.from === me ? 'You' : m.from) + ' · ' + time(m.ts);
    const b = document.createElement('div');
    b.className = 'bubble'; b.textContent = m.text;
    d.append(meta, b);
    append(d);
  }

  function append(el) {
    const box = $('messages');
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
    box.appendChild(el);
    if (atBottom) box.scrollTop = box.scrollHeight;
  }

  function closeStream() { if (es) { es.close(); es = null; } }

  function showLogin(msg) {
    closeStream();
    clearTimeout(retryTimer); clearTimeout(expiryTimer);
    token = null; me = null; expiresAt = 0; lastSeq = 0; ackedSeq = 0;
    store.clear();
    $('messages').innerHTML = '';
    $('chat').classList.add('hidden');
    $('login').classList.remove('hidden');
    $('pwd').value = '';
    $('loginErr').textContent = msg || '';
  }

  function enterChat(t, name, exp) {
    token = t; me = name; expiresAt = exp;
    store.set({ token, name, expiresAt });
    $('who').textContent = 'You are ' + me;
    $('login').classList.add('hidden');
    $('chat').classList.remove('hidden');
    sessionStatus();
    clearTimeout(expiryTimer);
    expiryTimer = setTimeout(() => showLogin('Session ended.'), Math.max(0, expiresAt - Date.now()));
    connect();
  }

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('loginErr').textContent = '';
    $('loginBtn').disabled = true;
    try {
      const r = await post('/api/login', { name: $('name').value, password: $('pwd').value });
      $('pwd').value = '';
      enterChat(r.token, r.name, r.expiresAt);
      $('text').focus();
    } catch (err) {
      $('loginErr').textContent = err.message;
    } finally {
      $('loginBtn').disabled = false;
    }
  });

  function connect() {
    closeStream();
    clearTimeout(retryTimer);
    lastSeen = Date.now();
    es = new EventSource('/api/stream?token=' + encodeURIComponent(token) + '&since=' + lastSeq);
    es.onopen = () => { retryDelay = 1000; sessionStatus(); };
    es.onmessage = (ev) => {
      lastSeen = Date.now();
      const m = JSON.parse(ev.data);
      if (m.id) { if (m.id <= lastSeq) return; lastSeq = m.id; } // skip re-sent duplicates
      if (m.type === 'msg') addMsg(m);
      else if (m.type === 'system') addNote(m.text + ' · ' + time(m.ts));
      else if (m.type === 'users') $('who').textContent = 'You are ' + me + ' · Online (' + m.users.length + '): ' + m.users.join(', ');
      else if (m.type === 'ended') showLogin(m.reason === 'full' ? 'Full' : m.reason === 'removed' ? 'You were removed' : 'Session ended.');
    };
    es.onerror = () => { closeStream(); scheduleReconnect(); };
  }

  // Reconnect quietly; only drop to the login screen if the server says
  // the session itself is gone (expired or logged out).
  function scheduleReconnect(now) {
    if (!token) return;
    clearTimeout(retryTimer);
    setStatus('Reconnecting…', true);
    retryTimer = setTimeout(async () => {
      try {
        await post('/api/session', { token });
        connect();
      } catch (err) {
        if (err.status === 401) return showLogin('Session ended.');
        retryDelay = Math.min(retryDelay * 2, 15000);
        scheduleReconnect();
      }
    }, now ? 0 : retryDelay);
  }

  function wake() {
    if (!token) return;
    if (Date.now() >= expiresAt) return showLogin('Session ended.');
    // Always open a fresh connection: after the phone was in another app the old
    // one can look open but be dead. Anything missed is re-sent by the server.
    closeStream(); retryDelay = 1000; scheduleReconnect(true);
  }
  // Tell the server what has arrived so it can forget it.
  setInterval(() => {
    if (!token || lastSeq <= ackedSeq) return;
    const upTo = lastSeq;
    post('/api/ack', { token, seq: upTo }).then(() => { ackedSeq = Math.max(ackedSeq, upTo); }).catch(() => {});
  }, 5000);

  // The server sends a heartbeat every 20s; silence means a dead connection.
  setInterval(() => {
    if (token && es && document.visibilityState === 'visible' && Date.now() - lastSeen > 45000) {
      closeStream(); retryDelay = 1000; scheduleReconnect(true);
    }
  }, 5000);

  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') wake(); });
  window.addEventListener('pageshow', wake);
  window.addEventListener('online', wake);

  $('composer').addEventListener('submit', async (e) => {
    e.preventDefault();
    const t = $('text').value.trim();
    if (!t || !token) return;
    $('text').value = ''; resize();
    try { await post('/api/send', { token, text: t, ack: lastSeq }); }
    catch (err) {
      if (err.status === 401) return showLogin('Session ended.');
      $('text').value = t; resize();
      addNote('Not sent');
    }
  });

  $('text').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('composer').requestSubmit(); }
  });
  function resize() { const t = $('text'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 140) + 'px'; }
  $('text').addEventListener('input', resize);

  $('leave').addEventListener('click', () => {
    if (token) post('/api/logout', { token }).catch(() => {});
    showLogin();
  });

  // Resume this tab's session if the browser reloaded it (e.g. after app switching).
  (async () => {
    const saved = store.get();
    if (!saved || !saved.token || saved.expiresAt <= Date.now()) { store.clear(); return; }
    try {
      const r = await post('/api/session', { token: saved.token });
      enterChat(saved.token, r.name, r.expiresAt);
    } catch { store.clear(); }
  })();
})();
</script>
</body>
</html>
