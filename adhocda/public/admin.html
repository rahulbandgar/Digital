<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Chat Admin</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #fff; --text: #1d2330; --muted: #6b7385;
    --border: #e1e4ea; --accent: #2f6fed; --accent-text: #fff; --error: #c62828;
    --ok: #2e7d32; --warn: #b26a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b1f27; --text: #e7e9ee; --muted: #8b93a5;
      --border: #2a303b; --accent: #5b8cff; --accent-text: #fff; --error: #ff6b6b;
      --ok: #66bb6a; --warn: #ffb74d;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .hidden { display: none !important; }
  #login { min-height: 100%; display: grid; place-items: center; padding: 16px; }
  .card { width: 100%; max-width: 360px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px; padding: 28px 24px; }
  h1 { margin: 0 0 12px; font-size: 22px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  input { width: 100%; padding: 10px 12px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 8px;
    background: var(--accent); color: var(--accent-text); padding: 10px 16px; }
  button:disabled { opacity: .6; cursor: default; }
  .card button { width: 100%; margin-top: 20px; }
  .error { color: var(--error); font-size: 13px; min-height: 18px; margin-top: 10px; }

  #panel { max-width: 720px; margin: 0 auto; padding: 16px; }
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .top h1 { margin: 0; flex: 1; }
  .ghost { background: transparent; color: var(--muted); border: 1px solid var(--border);
    padding: 6px 12px; font-size: 13px; }
  .danger { background: var(--error); color: #fff; padding: 6px 12px; font-size: 13px; }
  .count { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .list { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--border); }
  .row:first-child { border-top: 0; }
  .row .info { flex: 1; min-width: 0; }
  .row .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { color: var(--muted); font-size: 12px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .online { background: var(--ok); } .away { background: var(--warn); } .offline { background: var(--muted); }
  .empty { padding: 24px 16px; text-align: center; color: var(--muted); }
</style>
</head>
<body>

<section id="login">
  <form class="card" id="loginForm" autocomplete="off">
    <h1>Chat Admin</h1>
    <label for="pwd">Admin password</label>
    <input id="pwd" type="password" required>
    <button type="submit" id="loginBtn">Sign in</button>
    <div class="error" id="loginErr"></div>
  </form>
</section>

<section id="panel" class="hidden">
  <div class="top">
    <h1>Chat Admin</h1>
    <button class="danger" id="removeAll" type="button">Remove everyone</button>
    <button class="ghost" id="signout" type="button">Sign out</button>
  </div>
  <div class="count" id="count"></div>
  <div class="list" id="list"></div>
</section>

<script>
(() => {
  let token = null, timer = null;
  const $ = (id) => document.getElementById(id);
  const store = {
    get() { try { return sessionStorage.getItem('adhocda-admin'); } catch { return null; } },
    set(v) { try { sessionStorage.setItem('adhocda-admin', v); } catch {} },
    clear() { try { sessionStorage.removeItem('adhocda-admin'); } catch {} },
  };

  async function post(url, body) {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(data.error || 'Request failed'); e.status = r.status; throw e; }
    return data;
  }
  const time = (ts) => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  function showLogin(msg) {
    clearInterval(timer); token = null; store.clear();
    $('panel').classList.add('hidden'); $('login').classList.remove('hidden');
    $('loginErr').textContent = msg || '';
  }

  function showPanel(t) {
    token = t; store.set(t);
    $('login').classList.add('hidden'); $('panel').classList.remove('hidden');
    refresh();
    clearInterval(timer); timer = setInterval(refresh, 3000);
  }

  async function refresh() {
    if (!token) return;
    try {
      const { users, maxUsers } = await post('/api/admin/users', { token });
      render(users, maxUsers);
    } catch (err) {
      if (err.status === 401) showLogin('Signed out');
    }
  }

  function render(users, maxUsers) {
    const inRoom = users.filter((u) => u.status !== 'offline').length;
    $('count').textContent = 'In chat: ' + inRoom + ' / ' + maxUsers;
    $('removeAll').disabled = users.length === 0;
    const list = $('list'); list.innerHTML = '';
    if (!users.length) {
      const d = document.createElement('div'); d.className = 'empty'; d.textContent = 'Nobody is in the chat';
      return list.appendChild(d);
    }
    for (const u of users) {
      const row = document.createElement('div'); row.className = 'row';
      const info = document.createElement('div'); info.className = 'info';
      const name = document.createElement('div'); name.className = 'name';
      const dot = document.createElement('span'); dot.className = 'dot ' + u.status;
      name.append(dot, document.createTextNode(u.name));
      const meta = document.createElement('div'); meta.className = 'meta';
      const label = { online: 'Online', away: 'Away', offline: 'Not connected' }[u.status];
      meta.textContent = label + ' · joined ' + time(u.joinedAt) + ' · session ends ' + time(u.expiresAt);
      info.append(name, meta);
      const btn = document.createElement('button'); btn.className = 'danger'; btn.type = 'button';
      btn.textContent = 'Remove';
      btn.onclick = async () => {
        if (!confirm('Remove ' + u.name + ' from the chat?')) return;
        btn.disabled = true;
        try { await post('/api/admin/remove', { token, id: u.id }); } catch {}
        refresh();
      };
      row.append(info, btn);
      list.appendChild(row);
    }
  }

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('loginErr').textContent = ''; $('loginBtn').disabled = true;
    try {
      const r = await post('/api/admin/login', { password: $('pwd').value });
      $('pwd').value = '';
      showPanel(r.token);
    } catch (err) {
      $('loginErr').textContent = err.message;
    } finally { $('loginBtn').disabled = false; }
  });

  $('removeAll').addEventListener('click', async () => {
    if (!confirm('Remove everyone from the chat?')) return;
    try { await post('/api/admin/remove', { token, id: '*' }); } catch {}
    refresh();
  });

  $('signout').addEventListener('click', () => {
    if (token) post('/api/admin/logout', { token }).catch(() => {});
    showLogin();
  });

  const saved = store.get();
  if (saved) showPanel(saved);
})();
</script>
</body>
</html>
